[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "threatdesk"
version = "0.1.0"
description = "Threat-ops triage agent + vulnerability dashboard, single machine"
requires-python = ">=3.11"
license = { text = "Proprietary — pre-alpha" }
authors = [{ name = "Jax" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "claude-agent-sdk>=0.2.180",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[project.scripts]
threatdesk = "threatdesk.serve:main"

[tool.setuptools.packages.find]
include = ["threatdesk*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
